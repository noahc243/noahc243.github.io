<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Arial Narrow, Arial, sans-serif">
  <rect width="400" height="300" fill="#16171a"/>
  <text x="20" y="34" fill="#f6f3ef" font-size="17" font-weight="700" letter-spacing="1">CENTERING MECHANISM</text>
  <text x="20" y="52" fill="#d9c8b4" font-size="11">Top view · 2 motorized bars + 1 fixed corner (half the motors of a 4-bar design)</text>
  <!-- pad -->
  <rect x="110" y="72" width="190" height="190" fill="none" stroke="#3a3c41" stroke-width="1.5"/>
  <!-- fixed corner bracket (top-left) -->
  <path d="M112 74 H200 M112 74 V162" stroke="#d9c8b4" stroke-width="7" stroke-linecap="square"/>
  <text x="112" y="67" fill="#d9c8b4" font-size="10">FIXED CORNER</text>
  <!-- bar 1: right side, moving left -->
  <line x1="280" y1="92" x2="280" y2="250" stroke="#b3263a" stroke-width="7"/>
  <line x1="300" y1="120" x2="340" y2="120" stroke="#5f5e5a" stroke-width="3"/><line x1="300" y1="220" x2="340" y2="220" stroke="#5f5e5a" stroke-width="3"/>
  <rect x="340" y="108" width="34" height="24" fill="#2a2c30" stroke="#d9c8b4"/><text x="357" y="124" text-anchor="middle" fill="#f6f3ef" font-size="9">M1</text>
  <path d="M262 170 l-14 0 m0 0 l6 -5 m-6 5 l6 5" stroke="#b3263a" stroke-width="2" fill="none"/>
  <!-- bar 2: bottom, moving up -->
  <line x1="128" y1="244" x2="268" y2="244" stroke="#b3263a" stroke-width="7"/>
  <line x1="150" y1="262" x2="150" y2="284" stroke="#5f5e5a" stroke-width="3"/><line x1="240" y1="262" x2="240" y2="284" stroke="#5f5e5a" stroke-width="3"/>
  <rect x="62" y="270" width="34" height="22" fill="#2a2c30" stroke="#d9c8b4"/><text x="79" y="285" text-anchor="middle" fill="#f6f3ef" font-size="9">M2</text>
  <line x1="96" y1="281" x2="150" y2="281" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="2 3"/>
  <path d="M200 228 l0 -14 m0 0 l-5 6 m5 -6 l5 6" stroke="#b3263a" stroke-width="2" fill="none"/>
  <!-- drone body sliding to corner -->
  <rect x="168" y="128" width="64" height="64" rx="6" fill="none" stroke="#f6f3ef" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="124" y="86" width="64" height="64" rx="6" fill="#73000a" fill-opacity=".35" stroke="#f6f3ef" stroke-width="1.5"/>
  <path d="M190 160 L170 140" stroke="#d9c8b4" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#d9c8b4"/></marker></defs>
  <text x="20" y="100" fill="#bdb3a7" font-size="10">NEMA 17</text><text x="20" y="114" fill="#bdb3a7" font-size="10">lead-screw</text><text x="20" y="128" fill="#bdb3a7" font-size="10">bars push the</text><text x="20" y="142" fill="#bdb3a7" font-size="10">drone diagonally</text><text x="20" y="156" fill="#bdb3a7" font-size="10">into the corner</text>
</svg>
